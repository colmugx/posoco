name: check

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: '>=22.4.0'

      - name: install moonbit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> $GITHUB_PATH

      - name: moon version
        run: |
          moon version --all
          moonrun --version

      - name: moon update
        run: moon update

      - name: check (all targets)
        run: moon check --target all --deny-warn

      - name: format & interface check
        run: |
          moon fmt
          moon info
          git diff --exit-code

      - name: test (wasm + native-gated)
        run: moon test

      - name: test (native)
        run: moon test --target native

      - name: test (js)
        run: moon test --target js
