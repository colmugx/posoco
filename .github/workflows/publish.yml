name: publish

on:
  release:
    types: [released]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - name: install moonbit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> $GITHUB_PATH

      - name: moon version
        run: |
          moon version --all
          moonrun --version

      - name: moon update
        run: moon update

      - name: verify
        run: |
          moon check --target all --deny-warn
          moon fmt
          moon info
          git diff --exit-code
          moon test

      - name: publish
        run: |
          trap 'rm -f ~/.moon/credentials.json' EXIT
          printf '%s\n' "$SECRET" > ~/.moon/credentials.json
          moon publish
        env:
          SECRET: ${{ secrets.MOONCAKES_TOKEN }}
